<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <meta name="theme-color" content="#f2f0eb">
  <link rel="icon" href="https://codezenregmi.github.io/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="https://codezenregmi.github.io/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a class="u-link" href="{{ '/' | relative_url }}">All posts</a>
      <a class="u-link" href="{{ site.social.portfolio }}">Portfolio</a>
      <a class="u-link" href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer wrap">
    <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
    <span class="muted">Written in Kathmandu</span>
  </footer>
</body>
</html>
